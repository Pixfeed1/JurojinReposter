filters:
  interview_only:
    require_keywords: ["interview", "entretien", "rencontre", "confession", "revele", "confie", "behind the scenes", "making of", "artist spotlight", "exclusive", "exclu"]
    reject_keywords: ["tutorial", "tuto", "how to", "guide", "tips", "astuce", "top 10", "top 5", "best of"]
  news:
    require_keywords: []
    reject_keywords: ["sponsored", "advertisement", "top 10", "top 5"]

settings:
  max_external_posts_per_day: 3
  check_interval_hours: 2

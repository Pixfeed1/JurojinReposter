# Configuration TrendsToWordPress
# Thématiques à surveiller sur Google Trends

# Mode: 'core' = keywords essentiels uniquement, 'full' = tout
# Note: 'full' fait beaucoup de requêtes et peut être rate-limité par Google
mode: core

# Keywords essentiels (mode core) - focus sur les thématiques principales de jurojin.net
keywords_core:
  - Blender
  - Cinema 4D
  - Maya
  - ZBrush
  - Unreal Engine 5
  - Stable Diffusion
  - ComfyUI
  - After Effects

# Keywords complets (mode full) - toutes les thématiques
keywords:
  3d:
    - Blender
    - Cinema 4D
    - Maya
    - ZBrush
    - Substance Painter
    - Houdini

  vfx:
    - After Effects
    - Nuke
    - DaVinci Resolve
    - VFX

  moteurs:
    - Unreal Engine 5
    - Unity
    - Godot

  ia_generative:
    - Stable Diffusion
    - Midjourney
    - ComfyUI
    - Sora
    - Flux AI

  hardware:
    - Wacom
    - tablette graphique
    - RTX 5090

# Catégories de trends générales à scanner (Google Trends)
# Désactivé par défaut car très gourmand en requêtes
general_categories: []
# Pour activer: ['technology', 'entertainment']

# Matching config
matching:
  # Seuil minimum de similarité pour matcher (0-100)
  min_similarity_score: 60
  # Nombre max d'articles liés à inclure dans le prompt
  max_related_articles: 5
  # Nombre max de prompts à générer par jour
  max_prompts_per_day: 3

# Types d'articles et longueurs
article_types:
  actu:
    min_words: 800
    max_words: 1000
  tuto:
    min_words: 1200
    max_words: 1500
  guide:
    min_words: 1500
    max_words: 2500
  comparatif:
    min_words: 1200
    max_words: 2000
  opinion:
    min_words: 800
    max_words: 1200

# Scheduling
schedule:
  enabled: true
  time: "07:00"
  timezone: "Europe/Paris"

# WordPress
wordpress:
  default_category: "Actualités"
  draft_title_prefix: "[BRIEF]"

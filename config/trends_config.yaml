# Catégories de trends générales à scanner (Google Trends)
general_categories:
  - technology
  - entertainment
  - games

# Matching config
matching:
  # Seuil minimum de similarité pour matcher (0-100)
  min_similarity_score: 60
  # Nombre max d'articles liés à inclure dans le prompt
  max_related_articles: 5
  # Nombre max de prompts à générer par jour
  max_prompts_per_day: 3

# Types d'articles et longueurs
article_types:
  actu:
    min_words: 800
    max_words: 1000
  tuto:
    min_words: 1200
    max_words: 1500
  guide:
    min_words: 1500
    max_words: 2500
  comparatif:
    min_words: 1200
    max_words: 2000
  opinion:
    min_words: 800
    max_words: 1200

# Scheduling
schedule:
  enabled: true
  time: "07:00"
  timezone: "Europe/Paris"

# WordPress
wordpress:
  default_category: "Actualités"
  draft_title_prefix: "[BRIEF]"

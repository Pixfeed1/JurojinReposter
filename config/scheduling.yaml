twitter:
  enabled: true
  # 3 posts par jour aux heures de forte audience
  times: ["09:00", "13:00", "18:00"]
  timezone: "Europe/Paris"

  # Limite mensuelle pour rester sous 100 tweets (forfait gratuit)
  # 3 posts/jour = 90/mois, mais threads comptent multiple
  # Avec 2 threads/semaine (3 tweets chacun) = ~100 tweets/mois
  monthly_limit: 95

  # Jours préférés pour les threads (meilleur engagement)
  thread_days: ["tuesday", "thursday"]

facebook:
  enabled: false
  times: ["11:00"]
  post_every_n_days: 2
  timezone: "Europe/Paris"

bluesky:
  enabled: true
  # 5 posts par jour (pas de limite comme Twitter)
  times: ["09:00", "12:00", "15:00", "18:00", "21:00"]
  timezone: "Europe/Paris"
  # Inclut tous les articles, pas seulement evergreen
  include_all_articles: true
  # Intervalle minimum entre reposts (plus court que Twitter car illimite)
  min_repost_interval_days: 30

retry:
  max_attempts: 3
  delay_minutes: 60

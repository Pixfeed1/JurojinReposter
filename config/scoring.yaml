evergreen_categories:
  - blender
  - tutoriels
  - logiciels-3d
  - cinema-4d
  - after-effects
  - vfx

# Post types toujours evergreen (definis dans settings.py)
# - posts: selon categorie
# - guide: toujours evergreen
# - jeu: toujours evergreen
# - glossaire: toujours evergreen
# - anime: pas evergreen par defaut

evergreen_post_types:
  - guide
  - jeu
  - glossaire

excluded_categories:
  - actualites
  - news
  - evenements

weights:
  evergreen_category: 50
  article_older_than_6_months: 30
  never_reposted: 40
  not_reposted_90_days: 30
  word_count_over_1000: 20
  recent_article_penalty: -30

min_repost_interval:
  twitter: 90
  facebook: 90

# Twitter format thresholds
# thread_4: 4 tweets pour les articles longs et bien notés
# thread_3: 3 tweets pour les articles moyens
# simple: 1 tweet pour le reste
twitter_format:
  thread_4:
    min_score: 120
    min_word_count: 1500
  thread_3:
    min_score: 100
    min_word_count: 1000

bluesky_follow:
  enabled: true
  daily_limit: 28
  unfollow_after_days: 7
  min_delay_between_follows: 600  # 10 minutes en secondes

  # Segments avec quotas journaliers
  segments:
    - name: "micro"
      min_followers: 10
      max_followers: 100
      daily_quota: 6

    - name: "small"
      min_followers: 100
      max_followers: 500
      daily_quota: 6

    - name: "medium"
      min_followers: 500
      max_followers: 2000
      daily_quota: 6

    - name: "engaged"
      # Gens qui ont interagi avec des posts contenant nos keywords
      check_recent_interactions: true
      daily_quota: 5

    - name: "creators"
      # Gens qui ont poste du contenu avec nos keywords
      check_recent_posts: true
      daily_quota: 5

  # Filtres globaux (tous les segments)
  filters:
    min_posts: 5                    # Minimum de posts pour eviter comptes morts
    max_following_ratio: 3.0        # following/followers < 3 (evite les bots)
    last_post_max_days: 14          # Actif dans les 14 derniers jours
    exclude_following_back: true    # Ne pas follow quelqu'un qu'on follow deja

  # Keywords pour rechercher des cibles
  search_hashtags:
    - "Blender3D"
    - "b3d"
    - "VFX"
    - "Cinema"
    - "3Dart"
    - "MotionDesign"
    - "CGI"
    - "Animation3D"
    - "AfterEffects"
    - "Cinema4D"

  bio_keywords:
    - "blender"
    - "3d"
    - "vfx"
    - "cinema"
    - "animation"
    - "cgi"
    - "motion design"
    - "artiste 3d"
    - "3d artist"
    - "compositor"
